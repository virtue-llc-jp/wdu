[workspace]
members = [
    "crates/wdu-core",
    "crates/wdu-config",
    "crates/wdu-daemon",
    "crates/wdu-cli",
    "crates/wdu-storage",
    "crates/wdu-usage",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
notify = "8.2"
rusqlite = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
wdu-config = { path = "crates/wdu-config" }
wdu-core = { path = "crates/wdu-core" }
wdu-storage = { path = "crates/wdu-storage" }
wdu-usage = { path = "crates/wdu-usage" }
